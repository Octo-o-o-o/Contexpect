[workspace]
resolver = "3"
members = [
    "crates/ctxpect-core",
    "crates/ctxpect-schema",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/octoooo/ContextView"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
