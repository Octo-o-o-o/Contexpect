[workspace]
resolver = "3"
members = [
    "crates/ctxpect-advisor",
    "crates/ctxpect-assets",
    "crates/ctxpect-cli",
    "crates/ctxpect-collect",
    "crates/ctxpect-core",
    "crates/ctxpect-diff",
    "crates/ctxpect-doctor",
    "crates/ctxpect-effect",
    "crates/ctxpect-fs",
    "crates/ctxpect-importer",
    "crates/ctxpect-policy",
    "crates/ctxpect-projection",
    "crates/ctxpect-receipt",
    "crates/ctxpect-resolve",
    "crates/ctxpect-schema",
    "crates/ctxpect-store",
    "crates/ctxpect-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/octoooo/ContextView"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
